[project]
name = "select-pipeline"
version = "0.1.0"
description = "dagnet sample 08: pull semantics with --select."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/select_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
