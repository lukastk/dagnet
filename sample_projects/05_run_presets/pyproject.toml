[project]
name = "presets-pipeline"
version = "0.1.0"
description = "dagnet sample 05: named run configurations."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presets_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
