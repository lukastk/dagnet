[project]
name = "transient-pipeline"
version = "0.1.0"
description = "dagnet sample 06: asset = false nodes folded into graph-backed assets."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transient_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
