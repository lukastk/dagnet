[project]
name = "pools-pipeline"
version = "0.1.0"
description = "dagnet sample 04: concurrency pools and retries."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pools_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
