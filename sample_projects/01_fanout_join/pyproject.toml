[project]
name = "fanout-pipeline"
version = "0.1.0"
description = "dagnet sample 01: fan-out and join."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fanout_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
