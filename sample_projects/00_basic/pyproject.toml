[project]
name = "basic-pipeline"
version = "0.1.0"
description = "dagnet sample 00: a linear three-node pipeline."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
