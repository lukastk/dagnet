[project]
name = "ai-index"
version = "0.1.0"
description = "dagnet sample 09: an AISI-shaped pipeline with stub bodies."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_index"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
