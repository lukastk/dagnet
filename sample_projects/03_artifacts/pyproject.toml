[project]
name = "artifacts-pipeline"
version = "0.1.0"
description = "dagnet sample 03: declared durable artifacts."
requires-python = ">=3.11"
dependencies = ["dagnet", "duckdb>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifacts_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
