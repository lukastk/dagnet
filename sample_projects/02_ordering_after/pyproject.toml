[project]
name = "ordering-pipeline"
version = "0.1.0"
description = "dagnet sample 02: ordering-only dependencies."
requires-python = ">=3.11"
dependencies = ["dagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordering_pipeline"]

[tool.uv.sources]
dagnet = { path = "../..", editable = true }
