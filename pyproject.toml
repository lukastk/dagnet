[project]
name = "dagnet"
version = "0.0.1"
description = "A thin declarative wrapper around Dagster: the whole pipeline is a map file (TOML/JSON); the only code you write is each node's body."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukas Kikuchi" }]
dependencies = [
    "dagster>=1.13",
    "msgspec>=0.18",
]

[project.scripts]
dagnet = "dagnet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagnet"]

[tool.ruff]
line-length = 100
